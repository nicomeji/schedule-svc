spring:
  application:
    name: schedule-svc
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      adjust-dates-to-context-time-zone: false

  # Configuración de la base de datos PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/my_gym}
    username: ${SPRING_DATASOURCE_USERNAME:scheduler_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:password_seguro}
    driver-class-name: org.postgresql.Driver

  # Configuración de Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
